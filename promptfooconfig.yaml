description: 'Permission.io agent response eval — grades the response test 5 just captured live, not a fixed string'

prompts:
  - '{{response}}'

providers:
  - id: file://promptfoo/echoProvider.js

tests:
  - vars:
      response: file://artifacts/last-response.txt
    assert:
      - type: icontains
        value: 'Permission'
      - type: javascript
        value: 'output.length > 25 && /(permission|data|earn|token|broker)/i.test(output)'
      - type: not-icontains
        value: 'internal server error'
      # Requires OPENAI_API_KEY (grading model, default gpt-4o-mini) — catches
      # a coherent-sounding non-answer that keyword checks above would miss.
      - type: llm-rubric
        provider: openai:gpt-4o-mini
        value: 'The text explains what Permission.io is or does, in a way a new user could follow — not an error message, refusal, or off-topic reply.'
